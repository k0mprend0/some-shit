<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <!-- Basic Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <!-- Filled Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
    <!-- Brand Icons -->
    <link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">
    <title>Memory FlipCard Game</title>
</head>
<body>
    <div class="wrapper">
        <ul class="cards">
            <li class="card">
                <div class="view front-view">
                    <i class="bx bx-message-circle-question-mark"></i>
                </div>
                <div class="view back-view">
                    <i class="bx bx-car-bolt"></i>
                </div>
            </li>
            <li class="card">
                <div class="view front-view">
                    <i class="bx bx-message-circle-question-mark"></i>
                </div>
                <div class="view back-view">
                    <i class="bx bx-popcorn"></i>
                </div>
            </li>
            <li class="card">
                <div class="view front-view">
                    <i class="bx bx-message-circle-question-mark"></i>
                </div>
                <div class="view back-view">
                    <i class="bx bx-globe-alt-3"></i>
                </div>
            </li>
            <li class="card">
                <div class="view front-view">
                    <i class="bx bx-message-circle-question-mark"></i>
                </div>
                <div class="view back-view">
                    <i class="bx bx-rainbow-half"></i>
                </div>
            </li>
            <li class="card">
                <div class="view front-view">
                    <i class="bx bx-message-circle-question-mark"></i>
                </div>
                <div class="view back-view">
                    <i class="bx bx-discount"></i>
                </div>
            </li>
            <li class="card">
                <div class="view front-view">
                    <i class="bx bx-message-circle-question-mark"></i>
                </div>
                <div class="view back-view">
                    <i class="bx bx-core"></i>
                </div>
            </li>
            <li class="card">
                <div class="view front-view">
                    <i class="bx bx-message-circle-question-mark"></i>
                </div>
                <div class="view back-view">
                    <i class="bx bx-car-bolt"></i>
                </div>
            </li>
            <li class="card">
                <div class="view front-view">
                    <i class="bx bx-message-circle-question-mark"></i>
                </div>
                <div class="view back-view">
                    <i class="bx bx-popcorn"></i>
                </div>
            </li>
            <li class="card">
                <div class="view front-view">
                    <i class="bx bx-message-circle-question-mark"></i>
                </div>
                <div class="view back-view">
                    <i class="bx bx-globe-alt-3"></i>
                </div>
            </li>
            <li class="card">
                <div class="view front-view">
                    <i class="bx bx-message-circle-question-mark"></i>
                </div>
                <div class="view back-view">
                    <i class="bx bx-rainbow-half"></i>
                </div>
            </li>
            <li class="card">
                <div class="view front-view">
                    <i class="bx bx-message-circle-question-mark"></i>
                </div>
                <div class="view back-view">
                    <i class="bx bx-discount"></i>
                </div>
            </li>
            <li class="card">
                <div class="view front-view">
                    <i class="bx bx-message-circle-question-mark"></i>
                </div>
                <div class="view back-view">
                    <i class="bx bx-core"></i>
                </div>
            </li>
            <div class="details">
                <p class="time">Time: <span><b>0</b>s</span></p>
                <p class="flips">Flips: <span><b>0</b></span></p>
                <button>Refresh</button>
            </div>
        </ul>
    </div>



    <script src="script.js"></script>
</body>
</html>
